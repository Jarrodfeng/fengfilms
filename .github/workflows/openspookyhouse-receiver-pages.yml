# Publishes the Chromecast receiver page to GitHub Pages (run it manually from
# the Actions tab after enabling Settings > Pages > Source: "GitHub Actions").
# The receiver URL is then https://<user>.github.io/<repo>/
name: OpenSpookyHouse Cast receiver (GitHub Pages)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: openspookyhouse-android/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: openspookyhouse-android/web/dist/receiver
      - id: deployment
        uses: actions/deploy-pages@v4
